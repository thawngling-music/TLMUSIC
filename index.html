<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Thawng Ling Music</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thawng Ling Music">
<meta name="theme-color" content="#0f9d7a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f7f5;--card:#fff;--fill:#eceeea;--line:#e1e5df;--tx:#17201c;--mut:#78837c;--ac:#0f9d7a;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c110f;--card:#141a17;--fill:#1d2521;--line:#252e2a;--tx:#eaf1ed;--mut:#82908a;--ac:#3fdcab;--on:#04130d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c110f;--card:#141a17;--fill:#1d2521;--line:#252e2a;--tx:#eaf1ed;--mut:#82908a;--ac:#3fdcab;--on:#04130d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text","Helvetica Neue",system-ui,sans-serif}
body{padding:0 16px 96px;max-width:520px;margin:0 auto}
[hidden]{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 14px}
header h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.18em}
header button{min-height:36px;width:36px;padding:0;border-radius:50%;font-size:16px}
section{display:block}
.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--fill);border:0;border-radius:14px;padding:11px 14px}
button{cursor:pointer;min-height:46px}button:active{transform:scale(.97)}
.pri{background:var(--ac);color:var(--on);font-weight:600}
.big{width:100%;font-size:17px;min-height:56px;border-radius:18px}
.row2{display:flex;gap:8px;align-items:center}.row2>*{flex:1;min-width:0}
.num{font-size:96px;font-weight:200;line-height:1;text-align:center;letter-spacing:-.03em}
.mut,small{color:var(--mut)}.c{text-align:center}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input[type=range]{width:100%;padding:0;accent-color:var(--ac);background:none}
textarea,input[type=text],input[type=number],select{width:100%}
textarea{min-height:200px;resize:vertical}
.ch{padding:10px 0;min-height:44px;text-align:center}.ch.on{background:var(--ac);color:var(--on);font-weight:600}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sigs{display:flex;gap:6px;margin:14px 0}.sigs button{flex:1;padding:10px 0}
.pm{width:56px;height:56px;border-radius:50%;font-size:24px;padding:0;flex:none}
.dots{display:flex;gap:10px;justify-content:center;align-items:center;margin:16px 0;flex-wrap:wrap;min-height:20px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.b{width:15px;height:15px}.dots i.on{background:var(--ac)}.dots i.on.a{background:var(--tx)}
.item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:8px}
.item:last-child{border:0}.item small{display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border-radius:0;color:var(--mut);font-size:12px;min-height:58px;padding:0}
nav button.on{color:var(--ac);font-weight:600;box-shadow:inset 0 2px 0 var(--ac)}
.meter{position:relative;height:120px;margin:10px auto;width:260px}
.scale{position:absolute;inset:0;border-radius:260px 260px 0 0;border:2px solid var(--line);border-bottom:0}
.mid{position:absolute;left:50%;top:0;width:2px;height:14px;margin-left:-1px;background:var(--ac)}
.needle{position:absolute;left:50%;bottom:0;width:2px;height:112px;margin-left:-1px;background:var(--tx);transform-origin:50% 100%;transition:transform .12s linear}
.needle.ok{background:var(--ac);width:3px}
.note{font-size:84px;font-weight:200;line-height:1;text-align:center}
.chr{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:14px}
.chr b{font-weight:500;font-size:11px;text-align:center;padding:11px 0;border-radius:9px;background:var(--fill);color:var(--mut);cursor:pointer}
.chr b.on{background:var(--ac);color:var(--on)}
.strs{display:flex;gap:6px}.strs button{flex:1;padding:10px 0}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.v{background:var(--fill);border-radius:16px;padding:8px;border:2px solid transparent;cursor:pointer}.v.on{border-color:var(--ac)}
.v svg,.fv svg{width:100%;display:block}
svg .ln{stroke:var(--mut);fill:none}svg .d{fill:var(--ac)}svg text{fill:var(--mut);font-size:12px;text-anchor:middle}svg .w{fill:var(--card);stroke:var(--line)}svg .b{fill:var(--tx)}
.name{font-size:44px;font-weight:300;text-align:center;line-height:1.1}
.fv{position:relative;background:var(--fill);border-radius:16px;padding:8px;text-align:center;cursor:pointer}.fv small{display:block}
.fv .x{position:absolute;right:6px;top:2px;padding:4px 8px;color:var(--mut)}
</style></head><body>
<header><h1>THAWNG LING MUSIC</h1><button id="theme" aria-label="Switch theme">◐</button></header>

<section id="me">
 <div class="card">
  <div class="row2"><button class="pm" data-d="-1">−</button><div><div class="num" id="bpm">100</div><div class="c mut" id="tname">Moderato</div></div><button class="pm" data-d="1">+</button></div>
  <input type="range" id="bs" min="30" max="300" value="100" style="margin-top:14px">
  <div class="sigs" id="sigs"></div>
  <div class="dots" id="dots"></div>
  <button class="pri big" id="go">Start</button>
 </div>
 <div class="card">
  <div class="row2">
   <div><label style="margin-top:0">Beats per bar</label><select id="beats"></select></div>
   <div><label style="margin-top:0">Subdivision</label><select id="subs"><option value="1">Quarter</option><option value="2">Eighths</option><option value="3">Triplets</option><option value="4">Sixteenths</option></select></div>
  </div>
  <label>Volume</label><input type="range" id="vol" min="0" max="100" value="80">
  <button id="tap" class="big" style="margin-top:10px">Tap tempo</button>
  <p class="mut" style="font-size:13px;margin:12px 0 0">In 6/8 the tempo counts the dotted quarter note.</p>
 </div>
</section>

<section id="tn" hidden>
 <div class="card">
  <div class="note" id="nn">–</div>
  <div class="c mut" id="hz">Tap start and play a note</div>
  <div class="meter"><div class="scale"></div><div class="mid"></div><div class="needle" id="needle" style="transform:rotate(0deg)"></div></div>
  <div class="c" id="cents">0 cents</div>
  <div class="chr" id="chrom"></div>
  <button class="pri big" id="tgo" style="margin-top:16px">Start tuner</button>
  <p class="c mut" id="thint" style="font-size:13px"></p>
 </div>
 <div class="card">
  <div class="row2">
   <div><label style="margin-top:0">Instrument</label><select id="inst"><option>Guitar</option><option>Bass</option><option>Ukulele</option><option>Violin</option></select></div>
   <div><label style="margin-top:0">A4 pitch (Hz)</label><input type="number" id="a4" value="440" min="415" max="466"></div>
  </div>
  <label>Tap a string to hear it</label>
  <div class="strs" id="strs"></div>
 </div>
</section>

<section id="cd" hidden>
 <div class="card">
  <div class="name" id="cname">C</div><div class="c mut" id="cnotes"></div>
  <label>Root</label><div class="g6" id="roots"></div>
  <label>Type</label><select id="qual"></select>
  <label>Chord tones (tap to customize)</label><div class="chr" id="tones" style="margin-top:0"></div>
  <label>Instrument</label>
  <div class="row2"><select id="cinst"><option>Guitar</option><option>Ukulele</option><option>Piano</option></select><select id="ctun"></select><select id="capo"></select></div>
 </div>
 <div class="card"><div class="vg" id="vs"></div><div class="row2"><button class="pri" id="cplay">Play</button><button id="csave">Save chord</button></div></div>
 <div class="card"><b>My chords</b><div class="vg" id="favs" style="margin:12px 0 0"></div></div>
</section>

<section id="sl" hidden>
 <div id="list" class="card"></div>
 <button class="pri big" id="add">Add song</button>
 <div class="card" id="ed" hidden style="margin-top:12px">
  <label style="margin-top:0">Title</label><input type="text" id="st">
  <div class="row2"><div><label>Key</label><input type="text" id="sk" placeholder="Am"></div><div><label>Tempo (BPM)</label><input type="number" id="sb" min="30" max="300"></div></div>
  <label>Lyrics, chords or notes</label><textarea id="sy"></textarea>
  <div class="row2" style="margin-top:12px"><button class="pri" id="ssave">Save</button><button id="suse">Use tempo</button></div>
  <div class="row2" style="margin-top:8px"><button id="sdel">Delete</button><button id="sclose">Close</button></div>
 </div>
</section>

<section id="pr" hidden>
 <div class="card">
  <div class="num" id="clock" style="font-size:72px">00:00</div>
  <input type="text" id="pn" placeholder="What are you practicing?" style="margin:14px 0">
  <button class="pri big" id="pgo">Start practice</button>
  <div class="row2" style="margin-top:10px"><input type="number" id="pm" placeholder="Minutes" min="1"><button id="padd">Add minutes</button></div>
 </div>
 <div class="card"><div class="c" id="sum"></div></div>
 <div class="card" id="logs"></div>
</section>

<nav><button class="on" data-v="me">Metronome</button><button data-v="tn">Tuner</button><button data-v="cd">Chords</button><button data-v="sl">Setlist</button><button data-v="pr">Practice</button></nav>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let AC;function ctx(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function show(v){$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$$('section').forEach(s=>s.hidden=s.id!==v);if(v!=='tn')stopTuner()}
$$('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
/* theme */
const R=document.documentElement;
(()=>{const t=ld('theme','');if(t)R.dataset.theme=t})();
$('#theme').onclick=()=>{const d=R.dataset.theme?R.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;R.dataset.theme=d?'light':'dark';sv('theme',R.dataset.theme)};

/* Metronome */
let bpm=ld('bpm',100),beats=4,subs=1,comp=false,vol=.8,on=false,nextT=0,bt=0,sb=0,tm,taps=[];
const SIGS={'2/4':[2,1,0],'3/4':[3,1,0],'4/4':[4,1,0],'5/4':[5,1,0],'6/8':[2,3,1]};
$('#sigs').innerHTML=Object.keys(SIGS).map(k=>`<button data-k="${k}">${k}</button>`).join('');
const tempoName=b=>b<60?'Largo':b<76?'Adagio':b<108?'Andante':b<120?'Moderato':b<156?'Allegro':b<176?'Vivace':'Presto';
function setBpm(v){bpm=Math.max(30,Math.min(300,Math.round(v)));$('#bpm').textContent=bpm;$('#bs').value=bpm;$('#tname').textContent=tempoName(bpm);sv('bpm',bpm)}
function dots(){const n=comp?beats*subs:beats,g=comp?subs:1;$('#dots').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i%g?'':'b'}${i?'':' a'}"></i>`).join('')}
function setSig(k){const[b,s,c]=SIGS[k];beats=b;subs=s;comp=!!c;sv('sig',k);$('#beats').value=b;$('#subs').value=s;$('#subs').disabled=!!c;$$('#sigs button').forEach(x=>x.classList.toggle('on',x.dataset.k===k));bt=0;sb=0;dots()}
$('#sigs').onclick=e=>{if(e.target.dataset.k)setSig(e.target.dataset.k)};
for(let i=1;i<=12;i++)$('#beats').add(new Option(i,i));
$('#beats').onchange=e=>{beats=+e.target.value;comp=false;subs=+$('#subs').value;$('#subs').disabled=false;$$('#sigs button').forEach(x=>x.classList.remove('on'));bt=0;sb=0;dots()};
$('#subs').onchange=e=>{subs=+e.target.value;sb=0};
$('#vol').oninput=e=>vol=e.target.value/100;
$('#bs').oninput=e=>setBpm(+e.target.value);
$$('[data-d]').forEach(b=>b.onclick=()=>setBpm(bpm+ +b.dataset.d));
function click(t,lvl){const a=AC,o=a.createOscillator(),g=a.createGain();o.frequency.value=lvl==2?1500:lvl==1?1000:700;const p=Math.max(vol*(lvl==0?.5:1),.001);g.gain.setValueAtTime(p,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.06)}
function flash(b,s){if(!on)return;const i=comp?b*subs+s:(s?-1:b);if(i<0)return;$$('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i))}
function sched(){while(nextT<AC.currentTime+.12){const lvl=sb?0:(bt?1:2),b=bt,s=sb;click(nextT,lvl);setTimeout(()=>flash(b,s),Math.max(0,(nextT-AC.currentTime)*1000));nextT+=60/bpm/subs;sb++;if(sb>=subs){sb=0;bt=(bt+1)%beats}}}
function toggleM(){if(on){on=false;clearInterval(tm);$('#go').textContent='Start';dots();return}
 ctx();on=true;bt=0;sb=0;nextT=AC.currentTime+.06;sched();tm=setInterval(sched,25);$('#go').textContent='Stop'}
$('#go').onclick=toggleM;
$('#tap').onclick=()=>{const n=Date.now();if(taps.length&&n-taps[taps.length-1]>2000)taps=[];taps.push(n);taps=taps.slice(-6);if(taps.length>1)setBpm(60000/((taps[taps.length-1]-taps[0])/(taps.length-1)))};
setBpm(bpm);{const k=ld('sig','4/4');setSig(SIGS[k]?k:'4/4')}

/* Tuner */
const NN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const INST={Guitar:[['E2',40],['A2',45],['D3',50],['G3',55],['B3',59],['E4',64]],Bass:[['E1',28],['A1',33],['D2',38],['G2',43]],Ukulele:[['G4',67],['C4',60],['E4',64],['A4',69]],Violin:[['G3',55],['D4',62],['A4',69],['E5',76]]};
const A4=()=>Math.min(466,Math.max(415,+$('#a4').value||440));
const mf=m=>A4()*2**((m-69)/12);
function pluck(m,t,d){const a=AC,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=mf(m);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function strs(){$('#strs').innerHTML=INST[$('#inst').value].map(([n,m])=>`<button data-m="${m}">${n}</button>`).join('')}
$('#inst').onchange=strs;strs();
$('#strs').onclick=e=>{const m=e.target.dataset.m;if(m){ctx();pluck(+m,AC.currentTime+.01,2)}};
$('#chrom').innerHTML=NN.map(n=>`<b>${n}</b>`).join('');
let st=null,raf=0,last=0;
function detect(buf,sr){let r=0;for(let i=0;i<buf.length;i++)r+=buf[i]*buf[i];if(Math.sqrt(r/buf.length)<.01)return -1;
 const n=2048,lo=Math.floor(sr/1200),hi=Math.floor(sr/60),c=new Float32Array(hi+2);let mx=0;
 for(let l=lo;l<=hi;l++){let s=0;for(let i=0;i<n;i++)s+=buf[i]*buf[i+l];c[l]=s;if(s>mx)mx=s}
 if(mx<=0)return -1;
 for(let l=lo+1;l<hi;l++){if(c[l]>=.9*mx&&c[l]>=c[l-1]&&c[l]>=c[l+1]){const a=c[l-1],b=c[l],d=c[l+1],den=a-2*b+d,sh=den?.5*(a-d)/den:0;return sr/(l+sh)}}
 return -1}
async function startTuner(){
 try{const a=ctx(),s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const src=a.createMediaStreamSource(s),an=a.createAnalyser();an.fftSize=4096;src.connect(an);
  st={s,src,an,buf:new Float32Array(4096)};$('#tgo').textContent='Stop tuner';$('#thint').textContent='';loop()}
 catch(e){$('#thint').textContent='Microphone is blocked. Allow it for this page in Safari settings, then try again.'}}
function stopTuner(){cancelAnimationFrame(raf);if(st){st.s.getTracks().forEach(t=>t.stop());st.src.disconnect();st=null}$('#tgo').textContent='Start tuner'}
function loop(){if(!st)return;st.an.getFloatTimeDomainData(st.buf);const f=detect(st.buf,AC.sampleRate);let pc=-1;
 if(f>0){last=last&&Math.abs(f/last-1)<.05?(last*.5+f*.5):f;const m=69+12*Math.log2(last/A4()),n=Math.round(m),ct=(m-n)*100;pc=((n%12)+12)%12;
  $('#nn').textContent=NN[pc]+Math.floor(n/12-1);$('#hz').textContent=last.toFixed(1)+' Hz';
  $('#needle').style.transform=`rotate(${Math.max(-50,Math.min(50,ct))*.9}deg)`;
  const ok=Math.abs(ct)<5;$('#needle').classList.toggle('ok',ok);$('#cents').textContent=(ct>0?'+':'')+ct.toFixed(0)+' cents'+(ok?' · in tune':ct>0?' · too high':' · too low')}
 else last=0;
 $$('#chrom b').forEach((b,i)=>b.classList.toggle('on',i===pc));
 raf=requestAnimationFrame(loop)}
$('#tgo').onclick=()=>st?stopTuner():startTuner();

/* Chords */
const Q=[['Major','',[0,4,7]],['Minor','m',[0,3,7]],['Dominant 7','7',[0,4,7,10]],['Major 7','maj7',[0,4,7,11]],['Minor 7','m7',[0,3,7,10]],['Sus2','sus2',[0,2,7]],['Sus4','sus4',[0,5,7]],['6th','6',[0,4,7,9]],['Minor 6th','m6',[0,3,7,9]],['Add9','add9',[0,2,4,7]],['9th','9',[0,2,4,7,10]],['Minor 9th','m9',[0,2,3,7,10]],['Major 9th','maj9',[0,2,4,7,11]],['Diminished','dim',[0,3,6]],['Diminished 7','dim7',[0,3,6,9]],['Half-diminished','m7♭5',[0,3,6,10]],['Augmented','aug',[0,4,8]],['Power chord','5',[0,7]]];
const TUN={Guitar:{Standard:[40,45,50,55,59,64],'Drop D':[38,45,50,55,59,64],DADGAD:[38,45,50,55,57,62],'Open G':[38,43,50,55,59,62]},Ukulele:{Standard:[67,60,64,69],Baritone:[50,55,59,64]}};
let cs={root:0,q:0,custom:null,vi:0,vs:[],tun:[],pos:[]},favs=ld('favs',[]);
$('#roots').innerHTML=NN.map((n,i)=>`<button class="ch" data-r="${i}">${n}</button>`).join('');
$('#tones').innerHTML=NN.map((n,i)=>`<b data-t="${i}">${n}</b>`).join('');
$('#qual').innerHTML=Q.map((q,i)=>`<option value="${i}">${q[0]}</option>`).join('');
$('#capo').innerHTML=Array.from({length:8},(_,i)=>`<option value="${i}">${i?'Capo '+i:'No capo'}</option>`).join('');
const pcsOf=()=>cs.custom?[...cs.custom]:[...new Set(Q[cs.q][2].map(i=>(cs.root+i)%12))];
function solve(pcs,root,tun){const n=tun.length,need=Math.min(3,n),out=[],seen={};
 for(const tier of [pcs,pcs.filter(p=>p!==(root+7)%12)]){if(out.length)break;
  for(let p=1;p<=9;p++){const fr=new Array(n).fill(-1),opts=p===1?[0,1,2,3,4]:[p,p+1,p+2,p+3];
   const test=()=>{const pl=[];fr.forEach((f,i)=>{if(f>=0)pl.push(tun[i]+f)});const set=new Set(pl.map(x=>x%12));if(!tier.every(t=>set.has(t)))return;
    const key=fr.join();if(seen[key])return;seen[key]=1;const pr=fr.filter(f=>f>0),mn=pr.length?Math.min(...pr):0;let fg=0;
    if(pr.length){const idx=[];fr.forEach((f,i)=>{if(f===mn)idx.push(i)});const hi=pr.filter(f=>f>mn).length;
     if(idx.length>=2){const blocked=fr.some((f,i)=>f===0&&i>idx[0]&&i<idx[idx.length-1]);fg=hi+(blocked?idx.length:1)}else fg=hi+1}
    if(fg>4)return;const op=fr.filter(f=>f===0).length,bass=Math.min(...pl)%12;
    out.push({fr:fr.slice(),s:(n-pl.length)*1.5+fg+(bass===root?0:4)+(mn>1?(mn-1)*.35:0)-op*.3})};
   for(let m=0;m<=n-need;m++){fr.fill(-1);const rec=i=>{if(i===n){test();return}for(const f of opts){fr[i]=f;rec(i+1)}};rec(m)}}}
 return out.sort((a,b)=>a.s-b.s).slice(0,4)}
function diag(fr){const n=fr.length,pr=fr.filter(f=>f>0),mx=pr.length?Math.max(...pr):0,mn=pr.length?Math.min(...pr):1,top=mx<=4?1:mn,x0=24,y0=28,dy=22,dx=(110-34)/(n-1),xe=x0+dx*(n-1);
 let s=`<svg viewBox="0 0 110 140"><line class="ln" x1="${x0}" x2="${xe}" y1="${y0}" y2="${y0}" stroke-width="${top==1?4:1.5}"/>`;
 for(let r=1;r<=4;r++)s+=`<line class="ln" x1="${x0}" x2="${xe}" y1="${y0+dy*r}" y2="${y0+dy*r}"/>`;
 fr.forEach((f,i)=>{const x=x0+dx*i;s+=`<line class="ln" x1="${x}" x2="${x}" y1="${y0}" y2="${y0+dy*4}"/>`;
  if(f<0)s+=`<text x="${x}" y="${y0-8}">×</text>`;else if(f==0)s+=`<circle class="ln" cx="${x}" cy="${y0-12}" r="3.5"/>`;else s+=`<circle class="d" cx="${x}" cy="${y0+dy*(f-top+.5)}" r="6.5"/>`});
 if(top>1)s+=`<text x="8" y="${y0+dy*.5+4}">${top}</text>`;return s+'</svg>'}
function pdiag(pos){const W=[0,2,4,5,7,9,11,12,14,16,17,19,21,23],B=[1,3,6,8,10,13,15,18,20,22],S=new Set(pos);let s='<svg viewBox="0 0 308 100">';
 W.forEach((k,i)=>s+=`<rect x="${i*22+.5}" y=".5" width="21" height="98" rx="3" class="${S.has(k)?'d':'w'}"/>`);
 B.forEach(k=>s+=`<rect x="${W.indexOf(k-1)*22+15}" y=".5" width="14" height="58" rx="2" class="${S.has(k)?'d':'b'}"/>`);return s+'</svg>'}
const cname=()=>NN[cs.root]+(cs.custom?' custom':Q[cs.q][1]);
function rVs(){const p=$('#cinst').value==='Piano';
 $('#vs').innerHTML=p?`<div class="v on" style="grid-column:1/-1">${pdiag(cs.pos)}</div>`:cs.vs.length?cs.vs.map((v,i)=>`<div class="v${i===cs.vi?' on':''}" data-i="${i}">${diag(v.fr)}</div>`).join(''):'<p class="mut c" style="grid-column:1/-1">No easy shape found. Try another tuning or change the chord tones.</p>'}
function rChord(){const pc=pcsOf(),ord=pc.map(p=>(p-cs.root+12)%12).sort((a,b)=>a-b);
 $('#cname').textContent=cname();$('#cnotes').textContent=ord.map(i=>NN[(cs.root+i)%12]).join('  ');
 $$('#roots button').forEach((b,i)=>b.classList.toggle('on',i===cs.root));$$('#tones b').forEach((b,i)=>b.classList.toggle('on',pc.includes(i)));
 cs.pos=ord.map(i=>cs.root+i);const inst=$('#cinst').value;
 if(inst!=='Piano'){cs.tun=TUN[inst][$('#ctun').value].map(m=>m+ +$('#capo').value);cs.vs=solve(pc,cs.root,cs.tun);cs.vi=0}
 rVs()}
function ctun(){const i=$('#cinst').value,p=i==='Piano';$('#ctun').hidden=p;$('#capo').hidden=p;if(!p)$('#ctun').innerHTML=Object.keys(TUN[i]).map(k=>`<option>${k}</option>`).join('')}
$('#cinst').onchange=()=>{ctun();rChord()};$('#ctun').onchange=rChord;$('#capo').onchange=rChord;
$('#qual').onchange=e=>{cs.q=+e.target.value;cs.custom=null;rChord()};
$('#roots').onclick=e=>{if(e.target.dataset.r===undefined)return;cs.root=+e.target.dataset.r;cs.custom=null;rChord()};
$('#tones').onclick=e=>{if(e.target.dataset.t===undefined)return;const s=new Set(pcsOf()),t=+e.target.dataset.t;s.has(t)?s.delete(t):s.add(t);if(!s.size)return;cs.custom=s;rChord()};
$('#vs').onclick=e=>{const v=e.target.closest('.v');if(v&&v.dataset.i!==undefined){cs.vi=+v.dataset.i;rVs()}};
function playNotes(ms,strum){ctx();const t=AC.currentTime+.02;ms.forEach((m,i)=>pluck(m,t+i*strum,1.8))}
function curNotes(){if($('#cinst').value==='Piano')return[{ms:cs.pos.map(p=>60+p),st:0}][0];const v=cs.vs[cs.vi];return v?{ms:cs.tun.map((o,i)=>v.fr[i]>=0?o+v.fr[i]:null).filter(x=>x!==null),st:.045}:null}
$('#cplay').onclick=()=>{const c=curNotes();if(c)playNotes(c.ms,c.st)};
$('#csave').onclick=()=>{const inst=$('#cinst').value,f={id:Date.now(),name:cname(),inst};
 if(inst==='Piano')f.pos=cs.pos;else{const v=cs.vs[cs.vi];if(!v)return;f.fr=v.fr;f.tun=cs.tun;f.capo=+$('#capo').value}
 favs.push(f);sv('favs',favs);rFavs()};
function rFavs(){$('#favs').innerHTML=favs.length?favs.map(f=>`<div class="fv" data-id="${f.id}"><span class="x" data-del="1">×</span>${f.pos?pdiag(f.pos):diag(f.fr)}<small>${esc(f.name)}${f.capo?' · capo '+f.capo:''}</small></div>`).join(''):'<p class="mut" style="grid-column:1/-1;margin:0">Saved chords appear here. Tap one to hear it.</p>'}
$('#favs').onclick=e=>{const el=e.target.closest('.fv');if(!el)return;const id=+el.dataset.id;if(e.target.dataset.del){favs=favs.filter(f=>f.id!==id);sv('favs',favs);rFavs();return}
 const f=favs.find(x=>x.id===id);if(!f)return;f.pos?playNotes(f.pos.map(p=>60+p),0):playNotes(f.tun.map((o,i)=>f.fr[i]>=0?o+f.fr[i]:null).filter(x=>x!==null),.045)};
ctun();rChord();rFavs();

/* Setlist */
let songs=ld('songs',[]),cur=null;
function rList(){$('#list').innerHTML=songs.length?songs.map(s=>`<div class="item" data-id="${s.id}"><div><b>${esc(s.t||'Untitled')}</b><small>${esc(s.k||'')}${s.k&&s.b?' · ':''}${s.b?s.b+' BPM':''}</small></div><span class="mut">›</span></div>`).join(''):'<p class="mut c" style="margin:0">No songs yet. Tap “Add song” to start your setlist.</p>'}
function openEd(s){cur=s;$('#st').value=s.t||'';$('#sk').value=s.k||'';$('#sb').value=s.b||'';$('#sy').value=s.l||'';$('#ed').hidden=false;$('#ed').scrollIntoView({behavior:'smooth'})}
$('#add').onclick=()=>openEd({id:Date.now(),t:'',k:'',b:'',l:'',isNew:true});
$('#list').onclick=e=>{const r=e.target.closest('.item');if(r)openEd(songs.find(s=>s.id==r.dataset.id))};
$('#ssave').onclick=()=>{cur.t=$('#st').value.trim()||'Untitled';cur.k=$('#sk').value.trim();cur.b=+$('#sb').value||'';cur.l=$('#sy').value;if(cur.isNew){delete cur.isNew;songs.push(cur)}sv('songs',songs);rList();$('#ed').hidden=true};
$('#sdel').onclick=()=>{songs=songs.filter(s=>s.id!==cur.id);sv('songs',songs);rList();$('#ed').hidden=true};
$('#sclose').onclick=()=>$('#ed').hidden=true;
$('#suse').onclick=()=>{const b=+$('#sb').value;if(b){setBpm(b);show('me')}};
rList();

/* Practice */
let logs=ld('logs',[]),t0=0,tick;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function addLog(sec){logs.unshift({id:Date.now(),d:new Date().toISOString(),s:sec,n:$('#pn').value.trim()});sv('logs',logs);rLogs()}
function rLogs(){const wk=Date.now()-7*864e5,w=logs.filter(l=>new Date(l.d)>=wk).reduce((a,l)=>a+l.s,0),t=logs.reduce((a,l)=>a+l.s,0);
 $('#sum').innerHTML=`<b style="font-size:28px;font-weight:300">${Math.round(w/60)} min</b> this week<br><small>${Math.round(t/60)} min in total</small>`;
 $('#logs').innerHTML=logs.length?logs.map(l=>`<div class="item"><div><b>${Math.max(1,Math.round(l.s/60))} min</b> ${esc(l.n||'Practice')}<small>${new Date(l.d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></div><button data-id="${l.id}">Delete</button></div>`).join(''):'<p class="mut c" style="margin:0">Your practice sessions will show up here.</p>'}
$('#logs').onclick=e=>{const id=e.target.dataset.id;if(id){logs=logs.filter(l=>l.id!=id);sv('logs',logs);rLogs()}};
$('#pgo').onclick=()=>{if(!t0){t0=Date.now();tick=setInterval(()=>$('#clock').textContent=fmt(Math.floor((Date.now()-t0)/1000)),500);$('#pgo').textContent='Stop and save'}
 else{const s=Math.round((Date.now()-t0)/1000);clearInterval(tick);t0=0;$('#clock').textContent='00:00';$('#pgo').textContent='Start practice';if(s>=5)addLog(s)}};
$('#padd').onclick=()=>{const m=+$('#pm').value;if(m>0){addLog(m*60);$('#pm').value=''}};
rLogs();
